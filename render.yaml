services:
  - type: web
    name: cert-extract-app
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_BUCKET
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false